name: deepseek-harness
base: core24
version: "0.2.2-rc.1"
summary: DeepSeek Harness desktop shell with a bundled local runtime
description: |
  DeepSeek Harness is an Electron desktop shell for a bundled dsh runtime and
  external plugins.  The snap repackages the upstream unsigned AppImage; the
  Electron, Node and Python runtimes stay inside the snap because the desktop
  shell starts its Host with ELECTRON_RUN_AS_NODE.

  Confinement is strict.  This is a proof of concept: the app needs broad
  access to user workspaces, shells, local ports, git/pnpm/Python and plugin
  directories.  Some of those capabilities are unavailable or only reachable
  through the real home directory; see docs/distro-packaging-implementation.md.
  A classic-confinement variant would require Snap Store manual approval.
grade: stable
confinement: strict
license: MIT
website: https://github.com/deepseek-ai/deepseek-harness
contact: https://github.com/deepseek-ai/deepseek-harness/issues
issues: https://github.com/deepseek-ai/deepseek-harness/issues
source-code: https://github.com/deepseek-ai/deepseek-harness
icon: icon.png

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  # dsh keeps plugins/configuration in ~/.dsh.  A strict snap cannot see hidden
  # files in the real home directory through the `home` interface alone, so the
  # path has to be declared.  The Snap Store reviews personal-files requests.
  dot-dsh:
    interface: personal-files
    write:
      - $HOME/.dsh

apps:
  deepseek-harness:
    command: bin/deepseek-harness
    desktop: usr/share/applications/deepseek-harness.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind
      - process-control
      - system-observe
      - cups-control
      - dot-dsh

parts:
  deepseek-harness:
    plugin: dump
    source: https://github.com/deepseek-ai/deepseek-harness/releases/download/v0.2.2-rc.1/deepseek-harness-0.2.2-rc.1-linux-x86_64-unsigned.AppImage
    source-type: file
    source-checksum: sha256/cd9f8fc968d1278b6fc6919970c472064dc3d2e796315d36447ed323666a738d
    build-packages:
      - ca-certificates
    override-build: |
      set -eux
      appimage="$(find "$CRAFT_PART_SRC" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
      test -n "$appimage"
      chmod +x "$appimage"

      # --appimage-extract does not need FUSE, which is not available in the
      # snapcraft build environment.
      cd "$CRAFT_PART_SRC"
      "$appimage" --appimage-extract
      test -x squashfs-root/deepseek-harness

      install -dm755 "$CRAFT_PART_INSTALL/opt/deepseek-harness"
      cp -a squashfs-root/. "$CRAFT_PART_INSTALL/opt/deepseek-harness/"

      install -dm755 "$CRAFT_PART_INSTALL/bin"
      cat >"$CRAFT_PART_INSTALL/bin/deepseek-harness" <<'WRAPPER'
      #!/bin/sh
      # Snap wrapper for the AppImage runtime staged under $SNAP/opt.
      set -eu
      APPDIR="$SNAP/opt/deepseek-harness"
      export APPDIR
      export PATH="$APPDIR${PATH:+:$PATH}"
      export LD_LIBRARY_PATH="$APPDIR/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      export XDG_DATA_DIRS="$APPDIR/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
      export GSETTINGS_SCHEMA_DIR="$APPDIR/usr/share/glib-2.0/schemas${GSETTINGS_SCHEMA_DIR:+:$GSETTINGS_SCHEMA_DIR}"

      # A snap is mounted read-only, so the setuid chrome-sandbox cannot work.
      # Force Chromium's user-namespace sandbox.  If Snap's AppArmor profile
      # blocks unprivileged user namespaces on the target system, the app will
      # not start unless the user opts in to an unsandboxed run:
      #   DSHD_SNAP_NO_SANDBOX=1 snap run deepseek-harness
      set -- --disable-setuid-sandbox "$@"
      if [ "${DSHD_SNAP_NO_SANDBOX:-0}" = "1" ]; then
        set -- --no-sandbox "$@"
      fi
      exec "$APPDIR/deepseek-harness" "$@"
      WRAPPER
      chmod 755 "$CRAFT_PART_INSTALL/bin/deepseek-harness"

      install -dm755 "$CRAFT_PART_INSTALL/usr/share/applications"
      cat >"$CRAFT_PART_INSTALL/usr/share/applications/deepseek-harness.desktop" <<'DESKTOP'
      [Desktop Entry]
      Name=DeepSeek Harness
      Comment=Electron desktop shell for a bundled dsh runtime and external plugins
      Exec=deepseek-harness %U
      Icon=${SNAP}/usr/share/icons/hicolor/1024x1024/apps/deepseek-harness.png
      Terminal=false
      Type=Application
      StartupWMClass=DeepSeek Harness
      MimeType=x-scheme-handler/dsh;
      Categories=Development;
      DESKTOP

      install -Dm644 "$CRAFT_PART_INSTALL/opt/deepseek-harness/usr/share/icons/hicolor/1024x1024/apps/deepseek-harness.png" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/1024x1024/apps/deepseek-harness.png"
