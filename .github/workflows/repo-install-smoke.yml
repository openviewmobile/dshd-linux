name: Package repository install smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish package repositories"]
    types: [completed]

permissions:
  contents: read

jobs:
  apt:
    name: Install from APT (Debian 12)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install from the Pages APT repository
        run: |
          docker run --rm debian:12 bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl gnupg
            curl -fsSL https://openviewmobile.github.io/dshd-linux/key.asc \
              | gpg --dearmor -o /usr/share/keyrings/dshd-linux.gpg
            echo "deb [signed-by=/usr/share/keyrings/dshd-linux.gpg] https://openviewmobile.github.io/dshd-linux/apt stable main" \
              > /etc/apt/sources.list.d/dshd-linux.list
            apt-get update -qq
            apt-get install -y --no-install-recommends deepseek-harness
            dpkg -s deepseek-harness | grep -E "^(Status|Version):"
          '

  dnf:
    name: Install from DNF (Fedora 41)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install from the Pages DNF repository
        run: |
          docker run --rm fedora:41 bash -lc '
            set -euo pipefail
            curl -fsSL https://openviewmobile.github.io/dshd-linux/dshd-linux.repo \
              -o /etc/yum.repos.d/dshd-linux.repo
            dnf install -y deepseek-harness
            rpm -q deepseek-harness
          '

  arch:
    name: Install from pacman (Arch)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install from the Pages pacman repository
        run: |
          set -euxo pipefail
          pacman -Sy --noconfirm --needed archlinux-keyring gnupg
          pacman-key --init
          pacman-key --populate archlinux
          echo STEP_KEYRING_OK
          curl -fsSL https://openviewmobile.github.io/dshd-linux/key.asc -o /tmp/dshd-linux.asc
          echo STEP_CURL_OK
          pacman-key --add /tmp/dshd-linux.asc
          echo STEP_ADD_OK
          FPR="$(gpg --with-colons --show-keys /tmp/dshd-linux.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$FPR"
          echo "STEP_FPR=$FPR"
          pacman-key --lsign-key "$FPR"
          echo STEP_LSIGN_OK
          printf '\n[dshd-linux]\nServer = https://openviewmobile.github.io/dshd-linux/arch/x86_64\nSigLevel = Required DatabaseOptional\nPackageSigLevel = Optional\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm
          echo STEP_SYNC_OK
          pacman -S --noconfirm --needed dshd-linux-bin
          pacman -Q dshd-linux-bin
          test -x /usr/bin/deepseek-harness
          test -f /usr/share/applications/com.deepseek.harness.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/com.deepseek.harness.png
          echo ARCH_PACMAN_INSTALL_OK
