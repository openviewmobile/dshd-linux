name: Publish package repositories

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the signed assets
        required: true
        default: v0.2.2-rc.1
  workflow_run:
    workflows: ["Build Linux release assets"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.inputs.tag || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the static site
        uses: actions/checkout@v7

      - name: Install repository tooling and the release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::Set the GPG_PRIVATE_KEY repository secret."
            exit 1
          fi
          sudo timeout 300 apt-get update -qq -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          sudo timeout 300 apt-get install -y -qq -o Acquire::http::Timeout=30 -o Acquire::Retries=3 dpkg-dev apt-utils createrepo-c rpm gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons > /tmp/gpg-keys
          awk -F: '$1 == "fpr" { print $10; exit }' /tmp/gpg-keys > /tmp/gpg-fpr
          test -s /tmp/gpg-fpr

      - name: Download x86_64 release assets
        run: |
          set -euo pipefail
          test -n "$TAG"
          mkdir -p /tmp/assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-linux-amd64-unsigned.deb' \
            --pattern '*-linux-x86_64-unsigned.rpm' \
            --pattern '*-linux-x86_64-unsigned.AppImage' \
            --pattern 'dshd-linux-release-signing.asc' \
            --dir /tmp/assets

      - name: Build APT and DNF repositories
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          FPR="$(cat /tmp/gpg-fpr)"
          GPG=(gpg --batch --yes)
          RPM_SIGN_ARGS=(--define "__gpg_sign_cmd %{__gpg} gpg --batch --no-armor -u %{_gpg_name} -sbo %{__signature_filename} %{__plaintext_filename}")
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%s' "$GPG_PASSPHRASE" > /tmp/gpg-pass
            chmod 600 /tmp/gpg-pass
            GPG+=(--pinentry-mode loopback --passphrase-file /tmp/gpg-pass)
            RPM_SIGN_ARGS=(--define "__gpg_sign_cmd %{__gpg} gpg --batch --no-armor --pinentry-mode loopback --passphrase-file /tmp/gpg-pass -u %{_gpg_name} -sbo %{__signature_filename} %{__plaintext_filename}")
          fi
          rm -rf site/apt site/rpm site/dshd-linux.repo site/key.asc
          mkdir -p site/apt/pool/main/d/deepseek-harness
          mkdir -p site/apt/dists/stable/main/binary-amd64
          cp /tmp/assets/*-linux-amd64-unsigned.deb site/apt/pool/main/d/deepseek-harness/
          cp /tmp/assets/dshd-linux-release-signing.asc site/key.asc
          gpg --export --armor "$FPR" > site/key.asc
          (
            cd site/apt
            dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
            gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=DSHD \
              -o APT::FTPArchive::Release::Label=DSHD \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures=amd64 \
              -o APT::FTPArchive::Release::Components=main \
              release dists/stable > dists/stable/Release
            "${GPG[@]}" --clearsign -o dists/stable/InRelease dists/stable/Release
            "${GPG[@]}" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          )

          mkdir -p site/rpm/x86_64
          cp /tmp/assets/*-linux-x86_64-unsigned.rpm site/rpm/x86_64/
          rm -f site/rpm/x86_64/.rpms-signed
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%s' "$GPG_PASSPHRASE" > /tmp/gpg-pass
            chmod 600 /tmp/gpg-pass
          else
            : > /tmp/gpg-pass
          fi
          if docker run --rm \
            -e FPR="$FPR" \
            -e GPG_PASSPHRASE="${GPG_PASSPHRASE:-}" \
            -v "$PWD/site/rpm/x86_64:/rpms" \
            -v "$HOME/.gnupg:/root/.gnupg" \
            -v /tmp/gpg-pass:/tmp/gpg-pass:ro \
            -v "$PWD/scripts/sign-rpms.sh:/sign-rpms.sh:ro" \
            fedora:41 bash /sign-rpms.sh; then
            RPM_GPGCHECK=1
            rm -f site/rpm/x86_64/.rpms-signed
          else
            echo "::warning::RPM package signing failed; publishing metadata-signed repository with gpgcheck=0"
            RPM_GPGCHECK=0
          fi
          createrepo_c --database site/rpm/x86_64
          "${GPG[@]}" --armor --detach-sign -o site/rpm/x86_64/repodata/repomd.xml.asc site/rpm/x86_64/repodata/repomd.xml
          cat > site/dshd-linux.repo <<REPO
          [dshd-linux]
          name=DSHD for Linux
          baseurl=https://openviewmobile.github.io/dshd-linux/rpm/x86_64
          enabled=1
          gpgcheck=$RPM_GPGCHECK
          repo_gpgcheck=1
          gpgkey=https://openviewmobile.github.io/dshd-linux/key.asc
          REPO

          appimage_path="$(find /tmp/assets -maxdepth 1 -name "*-linux-x86_64-unsigned.AppImage" -print -quit)"
          test -n "$appimage_path"
          appimage_sha="$(sha256sum "$appimage_path" | awk '{print $1}')"
          docker run --rm \
            -e DSHD_APPIMAGE_X86_64="/assets/$(basename "$appimage_path")" \
            -e DSHD_SHA256_X86_64="$appimage_sha" \
            -v "$PWD/site:/site" \
            -v "$PWD/packaging/arch:/pkg:ro" \
            -v "/tmp/assets:/assets:ro" \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed base-devel git imagemagick squashfs-tools
              useradd -m builder
              mkdir -p /tmp/archbuild /site/arch/x86_64
              cp /pkg/PKGBUILD-ci /tmp/archbuild/PKGBUILD
              chown -R builder /tmp/archbuild /site/arch
              su -m builder -c "cd /tmp/archbuild && makepkg --noconfirm --cleanbuild --nodeps"
              cp /tmp/archbuild/*.pkg.tar.zst /site/arch/x86_64/
              repo-add /site/arch/x86_64/dshd-linux.db.tar.gz /site/arch/x86_64/*.pkg.tar.zst
            '

          cat > site/dshd-linux-arch.conf <<'ARCH'
          [dshd-linux]
          Server = https://openviewmobile.github.io/dshd-linux/arch/x86_64
          SigLevel = Optional DatabaseOptional
          ARCH

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
